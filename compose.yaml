name: summer-sum

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: summer-sum-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kb}
      POSTGRES_DB: ${POSTGRES_DB:-kb}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./scripts/setup/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.2
    container_name: summer-sum-tei
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./.tei-data:/data
    command: ["--model-id", "BAAI/bge-m3"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:80/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 600s

  # Separate CPU reranker. bge-m3 on :8080 cannot serve /rerank (TEI backend error).
  # Same cpu-1.2 tag as embedding (candle). Do not default to the GPU profile.
  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.2
    container_name: summer-sum-tei-rerank
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./.tei-rerank-data:/data
    command: ["--model-id", "${KB_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:80/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 600s

  # Optional GPU profile. Image 120-1.9 is experimental for RTX 50-series (ADR-001 D5).
  # Do not enable unless a human has verified it on this machine:
  #   docker compose --profile gpu up -d tei-gpu
  tei-gpu:
    profiles: ["gpu"]
    image: ghcr.io/huggingface/text-embeddings-inference:120-1.9
    container_name: summer-sum-tei-gpu
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./.tei-data:/data
    command: ["--model-id", "BAAI/bge-m3"]
    # GPU access is left unconfigured on purpose: enabling it requires a human
    # to verify the experimental 120-1.9 image on this machine (ADR-001 D5).
